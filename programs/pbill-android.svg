  PBill launcher icon (Android adaptive icon), 108 x 108 dp: 1 user unit = 1 dp.
  Launchers show the central 72 dp, cut to their own mask shape, and only the
  centred 66 dp circle is guaranteed visible (see the hidden "Guides" layer).

  Layers read by tools/make_icon.py (make icon):
  - background: full-canvas shapes, flat colours or linear gradients;
  - foreground: the artwork; flat fills only, no strokes (Path > Stroke to Path);
  - foreground/monochrome: the shapes that also form the Android 13+ themed
    icon, merged into one silhouette with the even-odd rule, so that a shape
    lying over another one cuts it out;
  - guides: ignored.
-->
