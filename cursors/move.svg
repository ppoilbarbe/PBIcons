<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Flèche identique à copy.svg : même pointe centrée (32,32) -->
  <path d="M32 32 L32 58 L38 53 L43 60 L48 57 L41 48 L50 48 Z"
        fill="#1a1a1a" stroke="#ffffff" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Badge "déplacement" : carré arrondi bleu avec icône en X (diagonales),
       délibérément distincte du "+" droit du badge "copie" pour éviter
       toute confusion visuelle à petite taille -->
  <rect x="40" y="40" width="20" height="20" rx="5" ry="5"
        fill="#2b7de9" stroke="#ffffff" stroke-width="3"/>
  <path d="M50 50 L45 45 M50 50 L55 45 M50 50 L45 55 M50 50 L55 55"
        stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
  <path d="M44 44 L44 48 L48 44 Z" fill="#ffffff"/>
  <path d="M56 44 L56 48 L52 44 Z" fill="#ffffff"/>
  <path d="M44 56 L44 52 L48 56 Z" fill="#ffffff"/>
  <path d="M56 56 L56 52 L52 56 Z" fill="#ffffff"/>
</svg>
