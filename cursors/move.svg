        fill="#2b7de9" stroke="#ffffff" stroke-width="3"/>
  <path d="M50 50 L50 45 M50 50 L50 55 M50 50 L45 50 M50 50 L55 50"
        stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 42 L47 46 L53 46 Z" fill="#ffffff"/>
  <path d="M50 58 L47 54 L53 54 Z" fill="#ffffff"/>
  <path d="M42 50 L46 47 L46 53 Z" fill="#ffffff"/>
  <path d="M58 50 L54 47 L54 53 Z" fill="#ffffff"/>
