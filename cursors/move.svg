<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Flèche identique à copy.svg : même pointe centrée (32,32), pour ne pas
       faire "sauter" le hotspot visuel lors du changement d'état pendant le drag -->
